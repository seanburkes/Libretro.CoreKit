name: Phase 4 CHIP-8 foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chip8-foundation:
    name: Linux x64 CHIP-8 C host
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Run CHIP-8 content lifecycle gate
        env:
          COREKIT_CHIP8_CYCLES: 1000
          COREKIT_CHIP8_SANITIZERS: ON
        run: ./eng/run-chip8.sh

      - name: Upload CHIP-8 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-4-chip8-linux-x64
          path: |
            artifacts/phase-4/linux-x64/core/corekit_chip8_libretro.so
            artifacts/phase-4/linux-x64/native-host/phase-4-result.json
            artifacts/phase-4/linux-x64/native-host/libretro_chip8_native_host
          if-no-files-found: warn
