name: Phase 0 native lifecycle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-lifecycle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            rid: linux-x64
            core: corekit_probe_libretro.so
          - name: Linux Arm64
            runner: ubuntu-22.04-arm
            rid: linux-arm64
            core: corekit_probe_libretro.so
          - name: Windows x64
            runner: windows-2025
            rid: win-x64
            core: corekit_probe_libretro.dll
          - name: Windows Arm64
            runner: windows-11-arm
            rid: win-arm64
            core: corekit_probe_libretro.dll
          - name: macOS x64
            runner: macos-15-intel
            rid: osx-x64
            core: corekit_probe_libretro.dylib
          - name: macOS Arm64
            runner: macos-15
            rid: osx-arm64
            core: corekit_probe_libretro.dylib

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT core
        run: >-
          dotnet publish src/Libretro.NativeAot.Probe/Libretro.NativeAot.Probe.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output artifacts/phase-0/${{ matrix.rid }}/core

      - name: Configure native lifecycle host
        run: >-
          cmake
          -S tests/Libretro.NativeHost
          -B artifacts/phase-0/${{ matrix.rid }}/native-host
          -DCORE_PATH=${{ github.workspace }}/artifacts/phase-0/${{ matrix.rid }}/core/${{ matrix.core }}
          -DCORE_CYCLES=1000
          -DCORE_MAX_RSS_GROWTH_MIB=16
          -DCMAKE_BUILD_TYPE=Release

      - name: Build native lifecycle host
        run: cmake --build artifacts/phase-0/${{ matrix.rid }}/native-host --config Release

      - name: Run native lifecycle stress test
        run: >-
          ctest
          --test-dir artifacts/phase-0/${{ matrix.rid }}/native-host
          --build-config Release
          --verbose

      - name: Upload native probe
        uses: actions/upload-artifact@v7
        with:
          name: phase-0-${{ matrix.rid }}
          path: artifacts/phase-0/${{ matrix.rid }}/core/${{ matrix.core }}
          if-no-files-found: error

  retroarch-lifecycle:
    name: Linux x64 RetroArch (headless)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT and RetroArch prerequisites
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang zlib1g-dev libsdl2-dev libx11-xcb-dev

      - name: Run RetroArch lifecycle gate
        env:
          COREKIT_RETROARCH_CONFIG: ${{ github.workspace }}/tests/RetroArch/headless.cfg
        run: ./eng/run-retroarch-phase-0.sh

      - name: Upload RetroArch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-0-retroarch-linux-x64
          path: |
            artifacts/retroarch/*/lifecycle.log
            artifacts/retroarch/*/lifecycle-summary.log
          if-no-files-found: warn
